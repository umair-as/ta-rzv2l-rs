<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f4a57"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3402f"/>
    </marker>
  </defs>

  <rect width="740" height="340" fill="#ffffff"/>

  <!-- zones -->
  <rect x="20" y="44" width="300" height="238" rx="12" fill="#fbfcfd" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="36" y="68" fill="#4a5563" font-size="13" font-weight="600">Normal world · Linux / REE</text>

  <rect x="420" y="44" width="300" height="238" rx="12" fill="#fbfcfd" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="436" y="68" fill="#4a5563" font-size="13" font-weight="600">Secure world · OP-TEE</text>

  <!-- TrustZone boundary wall -->
  <line x1="367" y1="52" x2="367" y2="300" stroke="#7b8794" stroke-width="2"/>
  <line x1="373" y1="52" x2="373" y2="300" stroke="#7b8794" stroke-width="2"/>
  <text x="370" y="176" fill="#7b8794" font-size="10.5" font-weight="600" letter-spacing="2" text-anchor="middle" transform="rotate(-90 370 176)">TRUSTZONE&#160;·&#160;SMC</text>

  <!-- signer-client -->
  <rect x="44" y="168" width="180" height="64" rx="8" fill="#f7f8fa" stroke="#3f4a57" stroke-width="2"/>
  <text x="134" y="196" text-anchor="middle" fill="#1c2430" font-size="15" font-weight="600">signer-client</text>
  <text x="134" y="214" text-anchor="middle" fill="#4a5563" font-size="11">opens session, invokes Sign</text>

  <!-- signer TA (focus) -->
  <rect x="440" y="86" width="262" height="182" rx="10" fill="#fdf4e6" stroke="#b06f1a" stroke-width="2.5"/>
  <text x="456" y="110" fill="#6b4310" font-size="14" font-weight="700">signer TA</text>

  <!-- private key, held inside -->
  <rect x="486" y="150" width="188" height="66" rx="8" fill="#eef6f1" stroke="#2f6f4f" stroke-width="2"/>
  <g stroke="#2f6f4f" stroke-width="2" fill="none">
    <path d="M504,182 v-4 a6,6 0 0 1 12,0 v4"/>
  </g>
  <rect x="501" y="182" width="18" height="14" rx="2" fill="#eef6f1" stroke="#2f6f4f" stroke-width="2"/>
  <circle cx="510" cy="189" r="1.7" fill="#2f6f4f"/>
  <text x="532" y="180" fill="#1e4634" font-size="13.5" font-weight="600">private key d</text>
  <text x="532" y="196" fill="#1e4634" font-size="10.5">generated in-TEE</text>
  <text x="456" y="248" fill="#6b4310" font-size="12">signs with ECDSA P-256 over the digest</text>

  <!-- digest crosses IN -->
  <line x1="224" y1="150" x2="482" y2="163" stroke="#3f4a57" stroke-width="2.2" marker-end="url(#slate)"/>
  <text x="320" y="140" text-anchor="middle" fill="#1c2430" font-size="12.5" font-weight="600">digest · 32 B</text>

  <!-- signature crosses OUT -->
  <line x1="482" y1="210" x2="226" y2="246" stroke="#3f4a57" stroke-width="2.2" marker-end="url(#slate)"/>
  <text x="330" y="262" text-anchor="middle" fill="#1c2430" font-size="12.5" font-weight="600">signature · r&#8201;‖&#8201;s · 64 B</text>

  <!-- private key is BLOCKED at the boundary -->
  <line x1="486" y1="188" x2="392" y2="188" stroke="#a3402f" stroke-width="2" stroke-dasharray="5 4"/>
  <g stroke="#a3402f" stroke-width="2.4">
    <line x1="380" y1="182" x2="392" y2="194"/>
    <line x1="392" y1="182" x2="380" y2="194"/>
  </g>
  <text x="300" y="192" text-anchor="middle" fill="#6d2a1f" font-size="12" font-weight="600">no path out</text>

  <!-- host verification, stated plainly -->
  <text x="370" y="316" text-anchor="middle" fill="#4a5563" font-size="11.5" font-style="italic">The development host verifies r&#8201;‖&#8201;s against the public key with an independent library.</text>
</svg>
